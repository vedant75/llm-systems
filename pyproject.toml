[project]
name = "llm-systems"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vedant Shah", email = "vedant7500@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true